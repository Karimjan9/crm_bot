# Include this inside the existing HTTPS `server` block for the Crm_document domain.
# The trailing slash on proxy_pass strips /telegram-bot/ before FastAPI sees the path.
location /telegram-bot/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /telegram-bot;
    proxy_read_timeout 65s;
}
